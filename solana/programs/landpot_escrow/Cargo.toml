[package]
name = "landpot-escrow"
version = "0.1.0"
description = "Landpot pot escrow (docs/LandpotPot.md)"
edition = "2021"
license = "AGPL-3.0-only"

[lib]
crate-type = ["cdylib", "lib"]
name = "landpot_escrow"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
# Tests and the local dev stack only: a 2 s minimum review hold.
localnet = []
# Declared so Anchor's macros don't warn about unknown cfgs.
custom-heap = []
custom-panic = []
anchor-debug = []

[dependencies]
anchor-lang = { version = "=0.31.1", features = ["init-if-needed"] }
anchor-spl = "=0.31.1"
